[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgedesign"
version = "0.1.0"
description = "Kunwari River submersible bridge design package (MP PWD design note)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bridgedesign = "bridgedesign.cli:main"

[tool.setuptools.packages.find]
include = ["bridgedesign*"]

[tool.pytest.ini_options]
testpaths = ["bridgedesign/tests"]
